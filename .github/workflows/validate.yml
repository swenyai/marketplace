name: Validate Workflows
on:
  pull_request:
    paths:
      - 'workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/validate.mjs
      - run: node scripts/check-unique-ids.mjs
