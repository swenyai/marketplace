id: changelog-generator
name: Changelog Generator
description: Generate a changelog from recent commits and merged PRs, categorize changes by type, and create a draft release
author: sweny-ai
category: content
tags: [changelog, release, documentation, automation]
icon: file-text
color: cyan
version: 1.0.0
sweny_version: ">=4.0.0"
entry: gather-changes
nodes:
  gather-changes:
    name: Gather Recent Changes
    instruction: >-
      Collect all changes since the last release:

      1. Find the latest release tag or version bump commit.
      2. List all commits since that point, grouped by author.
      3. Find all merged pull requests in the same time range.
      4. For each PR, extract: title, description, labels, and linked issues.
      5. Identify any breaking changes (look for "BREAKING" in commit messages or PR labels).

      Output the raw list of changes for categorization.
    skills:
      - github
  categorize:
    name: Categorize Changes
    instruction: >-
      Categorize each change into one of these sections:

      1. **Added** — new features and capabilities.
      2. **Changed** — changes to existing functionality.
      3. **Fixed** — bug fixes.
      4. **Deprecated** — features marked for removal.
      5. **Removed** — removed features or code.
      6. **Security** — security-related changes.

      For each entry, write a clear one-line description that a user (not developer) would understand.
      Include PR numbers as references. Highlight breaking changes prominently.

      Follow Keep a Changelog format (https://keepachangelog.com).
    skills:
      - github
    output:
      type: object
      properties:
        version:
          type: string
        sections:
          type: object
          properties:
            added:
              type: array
              items:
                type: string
            changed:
              type: array
              items:
                type: string
            fixed:
              type: array
              items:
                type: string
            deprecated:
              type: array
              items:
                type: string
            removed:
              type: array
              items:
                type: string
            security:
              type: array
              items:
                type: string
        has_breaking_changes:
          type: boolean
      required: [version, sections, has_breaking_changes]
  create-release:
    name: Create Draft Release
    instruction: >-
      Create a draft GitHub release with the generated changelog:

      1. Determine the next version number based on changes:
         - Breaking changes → major bump.
         - New features → minor bump.
         - Bug fixes only → patch bump.
      2. Create the release with the categorized changelog as the body.
      3. Mark it as a draft so maintainers can review before publishing.
      4. If there are breaking changes, add a prominent warning section at the top.

      Return the draft release URL.
    skills:
      - github
  notify:
    name: Notify Team
    instruction: >-
      Send a notification about the draft release:

      1. Include the version number and a brief summary of what's included.
      2. Count of changes by category (e.g., "3 features, 5 fixes, 1 breaking change").
      3. Link to the draft release for review.
      4. Tag maintainers if there are breaking changes.
    skills:
      - slack
      - notification
edges:
  - from: gather-changes
    to: categorize
  - from: categorize
    to: create-release
  - from: create-release
    to: notify
